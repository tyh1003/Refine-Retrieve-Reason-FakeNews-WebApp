# =========================================================
# 模型與環境基礎路徑配置
# =========================================================
# 原始基礎模型名稱
model_name: "google/gemma-2-2b-it" 
dataset: "FakeTT"
seed: 42

# 微調後的權重載入路徑 (請指向你訓練完後儲存的資料夾，例如 student_train.py 設定的輸出路徑)
# 若先前微調完儲存在 ./model/gemma2_2b_rag_finetuned，請在此處指定
epoch_dir: "./model/gemma2_2b_rag_finetuned/epoch_1"

# 資料來源路徑
teacher_data_path: "data/RAG.jsonl"
refine_data_path: "data/refine_retireve_updated.jsonl"


# =========================================================
# 序列與推論生成參數 (對齊 Causal LM 訓練設定)
# =========================================================
max_seq_length: 768    # 與訓練時的 MAX_LENGTH 保持一致 (768)
max_new_tokens: 256    # 模型生成 JSON 回答的最大長度

# 硬體與加速推論配置
bf16: false                 # 若在筆電 (RTX 4050/3060) 或 T4 測試請保持 false；高階 GPU 可改 true
attn_implementation: "sdpa" # 預設推論加速方式


# =========================================================
# LoRA 結構設定 (必須與訓練時完全一致，供 PeftModel 載入檢查)
# =========================================================
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: 
  - "q_proj"
  - "v_proj"
  - "k_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"


# =========================================================
# 系統提示詞（與訓練期完全相同的範本，確保推論格式不走鐘）
# =========================================================
system_prompt: |
  你是一個嚴格的 RAG 假訊息判斷系統，需要完成任務並嚴格的遵守任務限制。

  你需要輸出一個完整的 JSON 物件，包含以下三個欄位：
  1. pred_label：判斷短影音的真偽 (0 為真，1 為假)
  2. reason：判斷的原因 (必須使用繁體中文，完整說明依據)
  3. knowledge：在此判斷中最有用的前三筆背景知識條目 (List 格式)

  任務限制：
  - 不可自行引用額外的知識，不可產生幻覺。
  - pred_label 只能輸出 0 或 1。
  - "0" 表示「文字核心主張、短影音視覺內容描述」與背景知識一致，或「背景知識」不足以支持真假判斷時，不可自行推測，亦判斷為 0。
  - "1" 表示「文字核心主張、短影音視覺內容描述」與「背景知識」明顯矛盾、圖文不符，或已被背景知識證實為假。

  輸出格式範例如下：
  {"pred_label": 0, "reason": "短影音的文字核心主張與視覺內容描述均與背景知識完全一致。背景知識證實了事故發生日期與起因。因此，該內容為真實資訊。", "knowledge": ["目前搜尋結果中沒有關於該特定事故的詳細矛盾報導"]}